name: MemeAC
version: '${project.version}'
main: network.mememc.memeac.MemeAC
api-version: 1.16
prefix: MemeAC
authors: [MemeMC]
description: Advanced anticheat plugin with 99%+ accuracy detection and Geyser compatibility
website: https://mememc.network
softdepend: [Geyser-Spigot]

commands:
  memeac:
    description: Main MemeAC command
    usage: /<command> [info|checks|player|alerts|reload|ai|stats|profile|violations|exempt|debug|whitelist|ban|analyze|config|export|geyser]
    permission: memeac.admin
    aliases: [mac, anticheat]

permissions:
  memeac.*:
    description: Gives access to all MemeAC permissions
    children:
      memeac.admin: true
      memeac.alerts: true
      memeac.bypass: true
  memeac.admin:
    description: Allows access to admin commands
    default: op
  memeac.alerts:
    description: Allows receiving violation alerts
    default: op
  memeac.bypass:
    description: Bypasses all anticheat checks
    default: false
